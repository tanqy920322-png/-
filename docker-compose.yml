services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitout
      POSTGRES_PASSWORD: fitout
      POSTGRES_DB: fitout
    ports:
      - "5432:5432"
    volumes:
      - fitout_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitout -d fitout"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fitout_pg:
